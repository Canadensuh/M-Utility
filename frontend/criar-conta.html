<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Utility — Crachás</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/simbolos.css" />
  <link rel="stylesheet" href="css/icones.css" />
  <link rel="stylesheet" href="css/helpy.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/contas.css" />
  <link rel="stylesheet" href="css/mesa.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <link rel="stylesheet" href="css/teclas.css" />
  <link rel="stylesheet" href="css/papelaria.css" />
  <link rel="stylesheet" href="css/conta.css" />
  <link rel="stylesheet" href="css/celular.css" />
  <link rel="stylesheet" href="css/nc.css" />
  <link rel="stylesheet" href="css/cracha.css" />
</head>
<body class="tela-mesa tela-pagina tela-usuarios">

  <header class="mesa-topo">
    <a href="controle-nc.html" class="brand"><img src="assets/logo.png" alt="" /><span class="brand-nome">M-<b>Utility</b></span></a>
    <div class="topbar-acoes">
      <div class="usuario-menu">
        <span class="usuario-avatar" data-usuario-iniciais aria-hidden="true"></span>
        <span class="usuario-info"><strong data-usuario-nome></strong><span data-usuario-perfil></span></span>
        <button type="button" class="btn-sair" data-acao="sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="mesa pagina-cheia">
    <header class="area-topo centro-topo">
      <h2 id="tituloTampo"><i class="ic ic-cracha" aria-hidden="true"></i> Crachás</h2>
      <div class="abas nc-visao" role="tablist" aria-label="Cargo">
        <button type="button" class="btn aba ativo" role="tab" aria-selected="true" data-aba="geral"><i class="ic ic-equipe" aria-hidden="true"></i> Geral <span class="aba-qtd">0</span></button>
        <button type="button" class="btn aba" role="tab" aria-selected="false" data-aba="usuario"><i class="ic ic-usuario" aria-hidden="true"></i> Usuários <span class="aba-qtd">0</span></button>
        <button type="button" class="btn aba" role="tab" aria-selected="false" data-aba="admin"><i class="ic ic-coroa" aria-hidden="true"></i> Administradores <span class="aba-qtd">0</span></button>
      </div>
    </header>
    <section class="tampo pagina-tampo" id="tampo" aria-labelledby="tituloTampo">
      <div class="filtros-barra">
        <label class="busca-campo"><i class="ic ic-olho" aria-hidden="true"></i>
          <input class="input" id="busca" type="search" placeholder="Buscar por nome, e-mail ou ID…" autocomplete="off" /></label>
        <button type="button" class="btn btn-filtro" id="soSuspensos" aria-pressed="false"><i class="ic ic-pausa" aria-hidden="true"></i> Só suspensos</button>
        <div class="acao-lado acao-dir">
          <button type="button" class="btn btn-primary" id="abrirEmissor"><i class="ic ic-mais" aria-hidden="true"></i> Emitir crachá</button>
        </div>
      </div>
      <p class="aviso-offline" id="avisoOffline" hidden></p>
      <div class="grade-rolagem"><ul class="crachas crachas-usuarios" id="listaContas"></ul></div>
    </section>
  </main>

  <!-- Menu de configurações do crachá (abre na engrenagem do crachá) -->
  <div class="menu-cracha" id="menuCracha" role="menu" hidden></div>

  <!-- Modal: emitir crachá -->
  <dialog class="modal modal-emissor" id="modalEmissor">
    <div class="modal-conteudo">
      <header class="modal-topo">
        <h2><i class="ic ic-cracha" aria-hidden="true"></i> Emitir crachá</h2>
        <button type="button" class="btn btn-ghost btn-sm" data-fechar aria-label="Fechar"><i class="ic ic-x" aria-hidden="true"></i></button>
      </header>
      <div class="emissor-corpo">
        <form class="form-conta" id="formConta" novalidate>
          <div class="segmentado" role="radiogroup" aria-label="Perfil da nova conta">
            <input type="radio" name="perfil" id="novoUsuario" value="usuario" checked />
            <label for="novoUsuario"><i class="ic ic-usuario" aria-hidden="true"></i> Usuário</label>
            <input type="radio" name="perfil" id="novoAdmin" value="admin" />
            <label for="novoAdmin"><i class="ic ic-coroa" aria-hidden="true"></i> Administrador</label>
          </div>
          <p class="perfil-dica" id="perfilDica"></p>
          <label class="campo">Nome completo
            <input id="nome" type="text" maxlength="80" autocomplete="off" placeholder="Ex.: Pedro Alves" required />
          </label>
          <label class="campo">E-mail
            <input id="email" type="email" autocomplete="off" placeholder="nome@mutility.com.br" required />
          </label>
          <div class="campo">
            <label for="senha">Senha provisória</label>
            <div class="senha-linha">
              <input id="senha" type="text" minlength="4" autocomplete="off" required />
              <button type="button" class="btn btn-sm" id="gerarSenha"><i class="ic ic-dado" aria-hidden="true"></i> Gerar</button>
            </div>
          </div>
          <p class="aviso aviso-erro" id="aviso" role="alert" hidden></p>
          <button type="submit" class="btn key--green btn-lg btn-bloco" id="botaoCriar">Emitir crachá</button>
        </form>
        <div class="previa">
          <div class="fenda" aria-hidden="true"></div>
          <div class="previa-cracha" id="previaCracha"></div>
        </div>
      </div>
      <div class="credencial" id="credencial" hidden>
        <strong>Crachá emitido <i class="ic ic-check" aria-hidden="true"></i></strong>
        <p>Envie estes dados para <span id="credNome"></span>:</p>
        <dl>
          <dt>Entrar como</dt><dd id="credArea"></dd>
          <dt>E-mail</dt><dd id="credEmail"></dd>
          <dt>Senha</dt><dd id="credSenha"></dd>
        </dl>
        <button type="button" class="btn btn-sm" id="copiarCredencial"><i class="ic ic-copiar" aria-hidden="true"></i> Copiar dados</button>
      </div>
    </div>
  </dialog>

  <!-- Modal: editar crachá -->
  <dialog class="modal modal-editar" id="modalEditar">
    <form class="modal-conteudo" id="formEditar" novalidate>
      <header class="modal-topo">
        <h2><i class="ic ic-caneta" aria-hidden="true"></i> Editar crachá</h2>
        <button type="button" class="btn btn-ghost btn-sm" data-fechar aria-label="Fechar"><i class="ic ic-x" aria-hidden="true"></i></button>
      </header>
      <label class="campo">Nome completo <input id="editarNome" type="text" maxlength="80" autocomplete="off" /></label>
      <label class="campo">E-mail <input id="editarEmail" type="email" autocomplete="off" /></label>
      <div class="editar-senha" id="editarSenha"></div>
      <p class="aviso aviso-erro" id="erroEditar" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn key--green"><i class="ic ic-check" aria-hidden="true"></i> Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: usuário e senha do ICS (a pessoa vê com dois cliques no Helpy BOT + PIN) -->
  <dialog class="modal modal-editar modal-ics" id="modalIcs">
    <form class="modal-conteudo" id="formIcs" novalidate>
      <header class="modal-topo">
        <h2><i class="ic ic-chave" aria-hidden="true"></i> Usuário e senha do ICS</h2>
        <button type="button" class="btn btn-ghost btn-sm" data-fechar aria-label="Fechar"><i class="ic ic-x" aria-hidden="true"></i></button>
      </header>
      <p class="ics-dica">Crachá de <strong id="icsAlvo"></strong>. A pessoa vê esses dados clicando 2 vezes no Helpy BOT e colocando o PIN.</p>
      <label class="campo">Usuário do ICS <input id="icsUsuario" type="text" maxlength="60" autocomplete="off" spellcheck="false" /></label>
      <label class="campo">Senha do ICS
        <span class="ics-senha-linha">
          <input id="icsSenha" type="password" maxlength="80" autocomplete="new-password" spellcheck="false" />
          <button type="button" class="btn btn-ghost btn-sm ics-ver" id="icsVerSenha" aria-label="Mostrar a senha" aria-pressed="false" title="Mostrar/esconder"><i class="ic ic-olho" aria-hidden="true"></i></button>
        </span>
      </label>
      <p class="aviso aviso-erro" id="erroIcs" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn key--green"><i class="ic ic-check" aria-hidden="true"></i> Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: autorização (segurar para confirmar) -->
  <dialog class="modal modal-poder" id="modalPoder">
    <div class="modal-conteudo" id="conteudoPoder"></div>
  </dialog>


  <script src="js/catalogo.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/helpy.js"></script>
  <script src="js/ticket-ui.js"></script>
  <script src="js/contas.js"></script>
</body>
</html>
