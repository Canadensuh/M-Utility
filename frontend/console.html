<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Utility — Console</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/simbolos.css" />
  <link rel="stylesheet" href="css/helpy.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/mesa.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <link rel="stylesheet" href="css/teclas.css" />
  <link rel="stylesheet" href="css/papelaria.css" />
  <link rel="stylesheet" href="css/cracha.css" />
  <link rel="stylesheet" href="css/conta.css" />
  <link rel="stylesheet" href="css/celular.css" />
  <link rel="stylesheet" href="css/nc.css" />
</head>
<body class="tela-mesa tela-pagina tela-console">

  <header class="mesa-topo">
    <a href="controle-nc.html" class="brand" data-inicio><img src="assets/logo.png" alt="" /><span class="brand-nome">M-<b>Utility</b></span></a>
    <div class="topbar-acoes">
      <div class="usuario-menu">
        <span class="usuario-avatar" data-usuario-iniciais aria-hidden="true"></span>
        <span class="usuario-info"><strong data-usuario-nome></strong><span data-usuario-perfil></span></span>
        <button type="button" class="btn-sair" data-acao="sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="mesa pagina-cheia">
    <header class="area-topo centro-topo">
      <h2 id="tituloPagina"><i class="ic ic-terminal" aria-hidden="true"></i> Console</h2>
      <span class="pagina-sub">Digite <code>help</code> · ↑ ↓ histórico</span>
    </header>
    <section class="tampo pagina-tampo" aria-labelledby="tituloPagina">
      <div class="console-visor">
        <div class="console-saida" id="saida" role="log" aria-live="polite"></div>
        <form class="console-linha" id="formConsole" autocomplete="off">
          <span aria-hidden="true">$</span>
          <input id="comando" type="text" spellcheck="false" aria-label="Comando" placeholder="digite um comando…" />
          <button type="submit" class="btn btn-sm btn-primary">Executar</button>
        </form>
      </div>
      <input type="file" id="arquivoImportar" accept="application/json,.json" hidden />
    </section>
  </main>

  <!-- DROP: confirmação com o código de 6 dígitos -->
  <dialog class="modal modal-drop" id="modalDrop" aria-labelledby="tituloDrop">
    <div class="drop-barra" aria-hidden="true"><i></i><i></i><i></i><span>mutility — drop</span></div>
    <form class="modal-conteudo" id="formDrop" method="dialog" novalidate>
      <span class="drop-ico" aria-hidden="true">⚠</span>
      <h2 id="tituloDrop">drop · apagar todos os tickets</h2>
      <p id="textoDrop">Ação permanente. Digite o código de segurança.</p>
      <div class="drop-digitos" id="digitosDrop">
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 1" autocomplete="off" />
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 2" autocomplete="off" />
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 3" autocomplete="off" />
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 4" autocomplete="off" />
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 5" autocomplete="off" />
        <input inputmode="numeric" maxlength="1" aria-label="Dígito 6" autocomplete="off" />
      </div>
      <p class="aviso aviso-erro" id="erroDrop" hidden>Código incorreto.</p>
      <div class="modal-acoes">
        <button type="button" class="btn" id="cancelarDrop">Cancelar</button>
        <button type="button" class="btn key--red" id="confirmarDrop" disabled>Confirmar drop</button>
      </div>
    </form>
  </dialog>

  <script src="js/catalogo.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpy.js"></script>
  <script src="js/ticket-ui.js"></script>
  <script src="js/planilha.js"></script>
  <script src="js/anexos.js"></script>
  <script src="js/arquivos.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/console.js"></script>
</body>
</html>
