<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Utility — Localizar</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/simbolos.css" />
  <link rel="stylesheet" href="css/icones.css" />
  <link rel="stylesheet" href="css/helpy.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="stylesheet" href="css/mesa.css" />
  <link rel="stylesheet" href="css/paginas.css" />
  <link rel="stylesheet" href="css/teclas.css" />
  <link rel="stylesheet" href="css/papelaria.css" />
  <link rel="stylesheet" href="css/cracha.css" />
  <link rel="stylesheet" href="css/conta.css" />
  <link rel="stylesheet" href="css/celular.css" />
  <link rel="stylesheet" href="css/nc.css" />
</head>
<body class="tela-mesa tela-pagina tela-localizar">

  <header class="mesa-topo">
    <a href="controle-nc.html" class="brand" data-inicio><img src="assets/logo.png" alt="" /><span class="brand-nome">M-<b>Utility</b></span></a>
    <div class="topbar-acoes">
      <div class="usuario-menu">
        <span class="usuario-avatar" data-usuario-iniciais aria-hidden="true"></span>
        <span class="usuario-info"><strong data-usuario-nome></strong><span data-usuario-perfil></span></span>
        <button type="button" class="btn-sair" data-acao="sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="mesa pagina-cheia">
    <header class="area-topo centro-topo">
      <h2 id="tituloPagina"><i class="ic ic-pastas" aria-hidden="true"></i> Localizar</h2>
    </header>
    <section class="tampo pagina-tampo" aria-labelledby="tituloPagina">
      <div class="grade-rolagem">
        <!-- Ciclo do mês e arquivos -->
        <div class="ciclo-painel" id="cicloPainel"></div>

        <!-- Consulta dos meses anteriores -->
        <section class="localizar-consulta" aria-labelledby="tituloConsulta">
          <header class="localizar-topo">
            <h3 id="tituloConsulta"><i class="ic ic-olho" aria-hidden="true"></i> Consultar meses anteriores</h3>
            <div class="localizar-carregar">
              <button type="button" class="btn btn-sm" id="carregarPasta" hidden><i class="ic ic-pastas" aria-hidden="true"></i> Carregar da pasta</button>
              <button type="button" class="btn btn-sm btn-primary" id="importarArquivos"><i class="ic ic-download" aria-hidden="true"></i> Importar planilhas</button>
              <input type="file" id="arquivosImportar" accept=".csv,.json,text/csv,application/json" multiple hidden />
            </div>
          </header>
          <ul class="meses-carregados" id="mesesCarregados"></ul>
          <div class="filtros-barra localizar-filtros" id="filtrosConsulta" hidden>
            <label class="busca-campo"><i class="ic ic-olho" aria-hidden="true"></i>
              <input id="buscaConsulta" class="input" type="search" placeholder="#ID, NF, DANFE, AWB, cliente…" autocomplete="off" /></label>
            <select id="filtroMes" class="input" aria-label="Filtrar por mês"></select>
            <select id="filtroStatusConsulta" class="input" aria-label="Filtrar por status"></select>
            <span class="cartao-sub" id="contagemConsulta"></span>
          </div>
          <ul class="lista-tickets desktop-tickets" id="listaConsulta"></ul>
        </section>
      </div>
    </section>
  </main>

  <!-- Restaurar o mês: confirmação -->
  <input type="file" id="arquivoRestaurar" accept=".json,application/json" hidden />
  <p class="aviso-offline aviso-flutuante" id="avisoOffline" hidden></p>

  <script src="js/catalogo.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpy.js"></script>
  <script src="js/ticket-ui.js"></script>
  <script src="js/planilha.js"></script>
  <script src="js/anexos.js"></script>
  <script src="js/arquivos.js"></script>
  <script src="js/localizar.js"></script>
</body>
</html>
